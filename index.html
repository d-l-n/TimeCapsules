<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Personal TV show & movie tracking history dashboard — Time Capsules" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Time Capsules</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f0eb;color:#0a0a0a;font-family:'Courier New',Courier,monospace;padding:24px;text-align:center">
        <div style="max-width:420px;border:4px solid #0a0a0a;background:#fff;padding:32px 24px;box-shadow:4px 4px 0 #0a0a0a">
          <div style="font-size:40px;font-weight:900;text-transform:uppercase;letter-spacing:-1px;margin-bottom:12px">Time Capsules</div>
          <div style="width:48px;height:48px;margin:0 auto 16px;border:5px solid #0a0a0a;border-top-color:var(--color-accent,#FFD400);border-radius:50%;animation:bootspin .8s linear infinite"></div>
          <p style="font-weight:700;font-size:14px;text-transform:uppercase;margin:0">Loading…</p>
          <p style="font-size:12px;color:#3a3a3a;margin:8px 0 0">If this stays here, the app failed to load. Check your connection and reload.</p>
          <button onclick="location.reload()" style="margin-top:20px;border:4px solid #0a0a0a;background:var(--color-accent,#FFD400);color:#0a0a0a;font-weight:900;text-transform:uppercase;padding:12px 24px;font-family:inherit;cursor:pointer">Reload</button>
        </div>
      </div>
      <style>
        @keyframes bootspin { to { transform: rotate(360deg); } }
        @media (prefers-color-scheme: dark) {
          #boot-fallback { background:#0a0a0a;color:#f0f0f0; }
          #boot-fallback > div { background:#1e1e1e;border-color:#e0e0e0;box-shadow:4px 4px 0 #e0e0e0; }
          #boot-fallback p { color:#c0c0c0; }
          #boot-fallback button { background:var(--color-accent,#FFD400);color:#0a0a0a;border-color:#e0e0e0; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx" onerror="document.getElementById('boot-fallback') && (document.getElementById('boot-fallback').querySelector('p').textContent='Failed to load the app. Try reloading.')"></script>
  </body>
</html>
