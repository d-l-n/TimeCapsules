<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Personal TV show & movie tracking history dashboard — Time Capsules" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Time Capsules</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div class="splash-mono">TC</div>
        <div class="splash-wordmark">Time Capsules</div>
        <div class="splash-loader">
          <div class="splash-loader-track">
            <div class="splash-loader-fill"></div>
          </div>
        </div>
        <div class="splash-bar"></div>
      </div>

      <style>
        #boot-fallback {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #F6F6F3;
          font-family: 'Inter', 'Geist', system-ui, sans-serif;
          text-align: center;
          padding: 24px;
        }

        .splash-mono {
          font-size: clamp(90px, 18vw, 160px);
          font-weight: 900;
          letter-spacing: -0.08em;
          line-height: 1;
          color: #111111;
          text-shadow: 8px 8px 0 #FFD400;
          margin-bottom: 8px;
          user-select: none;
        }

        .splash-wordmark {
          font-size: clamp(14px, 2.5vw, 22px);
          font-weight: 900;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #111111;
          margin-bottom: 32px;
          line-height: 1.2;
        }

        .splash-loader-track {
          width: clamp(160px, 30vw, 260px);
          height: 8px;
          border: 3px solid #111111;
          background: transparent;
          overflow: hidden;
          position: relative;
        }

        .splash-loader-fill {
          width: 35%;
          height: 100%;
          background: #FFD400;
          animation: splash-sweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes splash-sweep {
          0%   { transform: translateX(-100%); }
          100% { transform: translateX(385%); }
        }

        .splash-bar {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 6px;
          background: #FFD400;
          box-shadow: 0 -3px 0 #111111;
        }

        @media (prefers-color-scheme: dark) {
          #boot-fallback { background: #0f0f0f; }
          .splash-mono { color: #f0f0f0; }
          .splash-wordmark { color: #f0f0f0; }
          .splash-loader-track { border-color: #f0f0f0; }
          .splash-bar { box-shadow: 0 -3px 0 #f0f0f0; }
        }

        @media (prefers-reduced-motion: reduce) {
          .splash-loader-fill { animation: none !important; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
